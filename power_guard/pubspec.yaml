name: power_guard
description: Smart Battery Optimization App — PowerGuard
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.10.8 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # ── State Management ──────────────────────────────
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # ── Navigation ────────────────────────────────────
  go_router: ^13.2.0

  # ── Local Storage ─────────────────────────────────
  hive_flutter: ^1.1.0
  hive: ^2.2.3

  # ── UI & Animations ───────────────────────────────
  flutter_animate: ^4.5.0
  google_fonts: ^6.2.1
  shimmer: ^3.0.0
  lottie: ^3.1.0
  fl_chart: ^0.68.0

  # ── Utils ─────────────────────────────────────────
  equatable: ^2.0.5
  freezed_annotation: ^2.4.1
  json_annotation: ^4.9.0
  intl: ^0.19.0
  logger: ^2.3.0
  battery_plus: ^7.0.0
  flutter_background_service: ^5.1.0
  home_widget: ^0.9.2
  flutter_local_notifications: ^18.0.0
  device_info_plus: ^13.1.0
  sensors_plus: ^7.0.0
  pdf: ^3.12.0
  printing: ^5.14.3
  usage_stats: ^1.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

  # ── Code Generation ───────────────────────────────
  build_runner: ^2.4.9
  freezed: ^2.5.2
  json_serializable: ^6.8.0
  riverpod_generator: ^2.4.0
  hive_generator: ^2.0.1
  flutter_launcher_icons: ^0.14.4

# ✅ FIXED: Completely stripped loose duplicate package versions that were breaking the YAML tree block structure

# 1. Standard Core Flutter Settings Block
flutter:
  uses-material-design: true
  assets:
    - assets/images/

# 2. Independent Launcher Icons Configuration Block (Strictly flush with left margin)
# ✅ FIXED: Appended the explicit root identifier key at zero indentation margin
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/icon.png"
  image_path_android: "assets/images/icon.png"
  image_path_ios: "assets/images/icon.png"
  remove_alpha_ios: true